upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    server_name xn--finanzmnch-kcb.de www.xn--finanzmnch-kcb.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name xn--finanzmnch-kcb.de www.xn--finanzmnch-kcb.de;

    ssl_certificate     /etc/letsencrypt/live/xn--finanzmnch-kcb.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--finanzmnch-kcb.de/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /accounts/ {
        proxy_pass http://django_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location / {
        try_files $uri /index.html;
    }
}