name: e2e tests

on:
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_PYTHON: python
      MAILPIT_URL: http://localhost:8025
      SECRET_KEY_BE: e2e-secret-key
      DEBUG: '1'
      # mocked external apis
      GEMINI_API_KEY: dummy-gemini-key
      FISH_API_KEY: dummy-fish-key
      FISH_VOICE_ID: dummy-voice-id
      STRIPE_PRIVATE_KEY: sk_test_e2e
      STRIPE_WEBHOOK_SECRET: whsec_e2e
      STRIPE_PRICE_ID_PREMIUM: price_e2e
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/info && exit 0
            sleep 2
          done
          echo "Mailpit nicht erreichbar" && exit 1

      # only core tests with 4 workers for more speed :)
      - name: Run E2E smoke tests
        working-directory: e2e
        timeout-minutes: 6
        run: npx playwright test -c playwright.ci.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (Traces, Videos, Screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 14
