<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finanzmönch</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px 24px;">
                <tr>
                    <td style="font-size:22px;font-weight:bold;padding-bottom:16px;">Finanzmönch</td>
                </tr>
                <tr>
                    <td style="font-size:15px;line-height:1.6;">
                        {% block content %}{% endblock content %}
                    </td>
                </tr>
                <tr>
                    <td style="font-size:12px;color:#71717a;padding-top:24px;border-top:1px solid #e4e4e7;">
                        Diese E-Mail wurde automatisch von Finanzmönch verschickt. Bitte antworte nicht darauf.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
